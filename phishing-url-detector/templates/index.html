<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1> Phishing URL Detector</h1>
        <p>Enter a URL to check if it's safe, suspicious, or a phishing site.</p>

        <input type="text" id="urlInput" placeholder="https://example.com" />
        <button id="analyzeBtn">Analyze URL</button>

        <div id="result" class="result hidden">
            <h2>Analysis Result</h2>
            <p><strong>URL:</strong> <span id="urlDisplay"></span></p>
            <p><strong>Risk Score:</strong> <span id="score"></span></p>
            <p><strong>Classification:</strong> <span id="classification"></span></p>
            <div id="details"></div>
        </div>

        <div id="error" class="error hidden"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
